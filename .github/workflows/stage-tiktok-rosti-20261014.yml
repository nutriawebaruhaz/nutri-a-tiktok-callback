name: Stage October 14 TikTok rosti image
on:
  push:
    paths:
      - '.github/workflows/stage-tiktok-rosti-20261014.yml'
permissions:
  contents: write
concurrency:
  group: nutri-a-tiktok-rosti-media
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Resize existing approved Wix image for TikTok only
        run: |
          set -euo pipefail
          mkdir -p tiktok-media
          curl --fail --location --retry 3 --silent --show-error 'https://static.wixstatic.com/media/f9969b_c1a8f35349064f919cc21cff41ab9c26~mv2.jpg' --output /tmp/rosti-source.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Path('/tmp/rosti-source.jpg')
          dst=Path('tiktok-media/weekly-2026-10-14-recipe-rosti-fried-eggs-v1-1080.jpg')
          with Image.open(src) as im:
              im.load()
              assert im.width == im.height and im.width >= 1080, f'UNEXPECTED_SOURCE_SIZE {im.size}'
              im=ImageOps.exif_transpose(im).convert('RGB')
              im.resize((1080,1080),Image.Resampling.LANCZOS).save(dst,format='JPEG',quality=90,optimize=True,progressive=False)
          with Image.open(dst) as check:
              check.verify()
          with Image.open(dst) as check:
              assert check.size == (1080,1080) and check.mode=='RGB' and check.format=='JPEG'
          assert 0 < dst.stat().st_size < 10_000_000
          import hashlib
          print('TIKTOK_STAGED_SHA256='+hashlib.sha256(dst.read_bytes()).hexdigest())
          print('TIKTOK_STAGED_BYTES='+str(dst.stat().st_size))
          PY
      - name: Commit TikTok-only media
        run: |
          set -euo pipefail
          git config user.name 'nutri-a-social-engine'
          git config user.email 'actions@users.noreply.github.com'
          git add tiktok-media/weekly-2026-10-14-recipe-rosti-fried-eggs-v1-1080.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Stage optimized October 14 TikTok rosti JPEG'
            git push origin HEAD:main
          fi
