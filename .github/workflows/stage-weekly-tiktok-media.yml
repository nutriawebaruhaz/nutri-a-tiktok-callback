name: Stage weekly TikTok media from verified Wix masters

on:
  push:
    paths:
      - 'queue/weekly-tiktok-staging-request.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nutri-a-weekly-public-tiktok-media
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install imaging and video dependencies
        run: |
          python -m pip install Pillow==11.3.0
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Build checked photo and video media from Wix
        run: python scripts/stage_weekly_tiktok_public.py
      - name: Persist weekly media and signed checksums atomically
        run: |
          set -euo pipefail
          git config user.name 'nutri-a-social-engine'
          git config user.email 'actions@users.noreply.github.com'
          tmpdir="$(mktemp -d)"
          cp -R tiktok-media "$tmpdir/tiktok-media"
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -R "$tmpdir/tiktok-media/." tiktok-media/
            git add tiktok-media/
            if git diff --cached --quiet; then
              echo 'TIKTOK_WEEKLY_MEDIA_ALREADY_CURRENT'
              exit 0
            fi
            git commit -m 'Stage weekly TikTok-optimized public media'
            if git push origin HEAD:main; then
              echo "TIKTOK_WEEKLY_MEDIA_STAGE_PERSIST_PASS attempt=$n"
              exit 0
            fi
          done
          exit 1
